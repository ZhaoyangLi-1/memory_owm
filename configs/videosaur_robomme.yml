# VideoSAUR (DINOv2) on RoboMME front-camera video — derived from
# cjepa/src/third_party/videosaur/configs/videosaur/pusht_dinov2_hf.yml.
# Changed (spec 7.1): input resolution 196 -> 252 (NUM_PATCHES 196 -> 324), NUM_SLOTS 4 -> 12,
# data = RoboMME shards that are already sub-sampled with stride 16 (num_frameskip 2 -> 1), wandb off.
# Everything else is the official default.
experiment_group: videosaur_robomme
experiment_name: robomme_dinov2

globals:
  NUM_SLOTS: 20           # N = n_max + 3；P2 实测 n_max = 17（VideoRepick 困难档 15 方块 + 按钮 + 机械臂）
  SLOT_DIM: 128
  DINO_MODEL: vit_small_patch14_dinov2.lvd142m
  FEAT_DIM: 384
  NUM_PATCHES: 324         # 252 / 14 = 18 -> 18 x 18 DINOv2 patches
  NUM_GPUS: 1
  BATCH_SIZE_PER_GPU: 64
  TOTAL_BATCH_SIZE: "${mul: ${.NUM_GPUS}, ${.BATCH_SIZE_PER_GPU}}"
  BASE_LR: 0.0001
  SIM_WEIGHT: 0.25
  # 官方 0.25。RoboMME 上相邻帧的 patch 余弦相似度是 0.878 ± 0.047（324 个候选挤在 0.2 宽的带子里），
  # 除以 0.25 后 softmax 几乎是均匀的：目标熵 5.766 vs 均匀 ln(324)=5.781，等效候选数 319/324。
  # 于是 loss_timesim 的理论下界就是它自己的熵，实测训练 100k 步只从 5.781 降到 5.7676 —— VideoSAUR 的
  # 核心机制（时间特征相似度）完全没生效，退化成 DINOSAUR。温度是随数据尺度而定的量纲参数，换数据集需重标定。
  # 实测扫描：0.25 -> 等效候选 319 | 0.1 -> 296 | 0.05 -> 227 | 0.02 -> 57（top-1 概率 0.15，目标有指向性）
  # threshold 无效（相似度最小值 0.778，0.5/0.7 屏蔽不到任何值），温度是唯一有效旋钮。详见 RUN.md 第 4 节 D.5。
  SIM_TEMP: 0.02

wandb:            # project / entity / mode / enable are overridden by scripts/p5b_train_videosaur.sh
                  # from configs/experiment.yaml -> wandb, so all trainings share one setting
  enable: true
  project: owm_memory
  name: ${experiment_name}
  group: ${experiment_group}
  tags: [robomme, dinov2, videosaur]
  mode: online


trainer:
  accelerator: gpu
  max_steps: 100000
  log_every_n_steps: 1
  val_check_interval: 1000
  gradient_clip_val: 0.05

optimizer:
  name: Adam
  # Scale learning rate by batch size: take base lr once for every 32 samples
  lr: "${eval_dummy: 'a / 32 * b', ${globals.TOTAL_BATCH_SIZE}, ${globals.BASE_LR}}"
  lr_scheduler:
    name: exp_decay_with_warmup
    warmup_steps: 2000
    decay_steps: ${trainer.max_steps}

model:
  input_type: video
  visualize: true
  visualize_every_n_steps: 5000

  losses:
    loss_featrec:
      name: MSELoss
      pred_dims:
        - 0
        - ${globals.FEAT_DIM}
    loss_timesim:
      name: CrossEntropyLoss
      target_key: encoder.vit_block_keys12
      remove_last_n_frames: 1
      pred_dims:
        - ${globals.FEAT_DIM}
        - "${add: ${globals.FEAT_DIM}, ${globals.NUM_PATCHES}}"
      target_transform:
        name: utils.FeatureTimeSimilarity
        softmax: true
        temperature: ${globals.SIM_TEMP}
        threshold: 0.0
  loss_weights:
    loss_timesim: ${globals.SIM_WEIGHT}
    loss_featrec: 1.0

  initializer:
    name: RandomInit
    n_slots: ${globals.NUM_SLOTS}
    dim: ${globals.SLOT_DIM}

  encoder:
    backbone:
      name: TimmExtractor
      model: ${globals.DINO_MODEL}
      features:
      - vit_block12
      - vit_block_keys12
      frozen: true
      pretrained: true
    output_transform:
      name: networks.two_layer_mlp
      inp_dim: ${globals.FEAT_DIM}
      outp_dim: ${globals.SLOT_DIM}
      hidden_dim: "${mul: ${globals.FEAT_DIM}, 2}"
      layer_norm: true

  grouper:
    name: SlotAttention
    inp_dim: ${globals.SLOT_DIM}
    slot_dim: ${globals.SLOT_DIM}
    n_iters: 2
    use_mlp: false

  latent_processor:
    first_step_corrector_args:
      n_iters: 3

  decoder:
    name: SlotMixerDecoder
    inp_dim: ${globals.SLOT_DIM}
    embed_dim: ${globals.SLOT_DIM}
    outp_dim: "${add: ${globals.FEAT_DIM}, ${globals.NUM_PATCHES}}"
    n_patches: ${globals.NUM_PATCHES}
    allocator:
      name: TransformerEncoder
      dim: ${globals.SLOT_DIM}
      memory_dim: ${globals.SLOT_DIM}
      n_blocks: 3
      n_heads: 4
    renderer:
      name: MLP
      inp_dim: ${globals.SLOT_DIM}
      outp_dim: 1024
      hidden_dims: [1024, 1024]
      final_activation: true
    renderer_dim: 1024
    use_layer_norms: true
    pos_embed_mode: add

  predictor:
    name: networks.TransformerEncoder
    dim: ${globals.SLOT_DIM}
    n_blocks: 1
    n_heads: 4

val_metrics: null

dataset:
  train_shards: "OVERRIDE_ME"   # set by scripts/p5b_train_videosaur.sh from cache/videosaur_shards/info.json
  val_shards: "OVERRIDE_ME"
  batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_batch_size: ${globals.BATCH_SIZE_PER_GPU}
  val_size: 20
  num_workers: 8 
  num_val_workers: 1
  train_pipeline:
    chunk_size: 6
    num_frameskip: 1    # the shards are already sub-sampled with stride 16
    keys: [video]
    sample_one_chunk_per_video: true
    transforms:
      name: clevrer_train
      type: video
      # crop_type: short_side_resize_random
      input_size: 252
      h_flip_prob: 0.5
  val_pipeline:
    use_chunks: true
    chunk_size: 6
    num_frameskip: 1
    keys: [video]
    transforms:
      name: clevrer_val
      type: video
      # crop_type: central
      input_size: 252
      use_segmentations: false
